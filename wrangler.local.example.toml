pages_build_output_dir = "dist"

# Optional Cloudflare Workers AI binding. The service remains disabled until enabled in Admin.
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "your-d1-database-name"
database_id = "your-d1-database-id"
